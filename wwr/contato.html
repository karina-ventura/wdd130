<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fale Conosco | White Water Rafting</title>
    <meta name="description" content="Página de contato da White Water Rafting para dúvidas, reservas, e sugestões.">
    <meta name="author" content="Karina Evelyn Ventura de Oliveira">
    <link rel="stylesheet" href="estilos/rafting.css">
</head>

<body>

    <header>
        <img src="imagens/z-rapids-trees.png" alt="Logo da empresa">

        <nav>
            <a href="index.html">Página Inicial</a>
            <a href="sobre.html">Sobre Nós</a>
            <a href="passeios.html">Passeios</a>
            <a href="contato.html">Fale Conosco</a>
        </nav>

    </header>

    <main>

        <h1>Companhia de Rafting em Corredeiras</h1>

        <section class="contact-info">

            <p>123 Rua Principal do Rio</p>

            <p>Foz do Iguaçu, Paraná</p>

            <p>+55 45 99999-9999</p>

            <p>info@corredeiras.com</p>

        </section>

        <section class="contact-layout">

            <div class="map">
                <iframe
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d115219.22800322376!2d-54.62910289070142!3d-25.5183543888375!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94f690ebae530a43%3A0x21979473b4c4a952!2sFoz%20do%20Igua%C3%A7u%2C%20PR!5e0!3m2!1spt-BR!2sbr!4v1780710035745!5m2!1spt-BR!2sbr"
                    width="600" height="450" allowfullscreen="" loading="lazy"
                    referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>

            <form>

                <label for="name">Nome:</label>
                <input type="text" id="name" name="name" placeholder="Digite aqui">

                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" placeholder="Digite aqui">

                <div class="purpose-group">

                    <p>Propósito da Mensagem</p>

                    <div class="radio-options">

                        <label>
                            <input type="radio" name="purpose" value="general"> Dúvida Geral
                        </label>

                        <label>
                            <input type="radio" name="purpose" value="reservation"> Pergunta sobre Reserva
                        </label>

                        <label>
                            <input type="radio" name="purpose" value="suggestion"> Sugestão
                        </label>

                    </div>

                </div>

                <label for="message">Mensagem:</label>
                <textarea id="message" name="message" placeholder="Digite aqui"></textarea>

                <label>
                    <input type="checkbox" name="newsletter"> Por favor, me inscreva na newsletter mensal
                </label>

                <button type="submit">Entrar em Contato!</button>

            </form>

        </section>

        <section class="employees">

            <h2>Estamos Aqui para Servi-lo</h2>

            <div class="employee-gallery">

                <figure>
                    <img src="imagens/guia.jpg" alt="João Paulo">
                    <figcaption>João Paulo - Guia de Rafting</figcaption>
                </figure>

                <figure>
                    <img src="imagens/coordenador.jpg" alt="Thiago Gomes">
                    <figcaption>Thiago Gomes - Coordenador de Passeios</figcaption>
                </figure>

                <figure>
                    <img src="imagens/especialista.jpg" alt="Gustavo Moura">
                    <figcaption>Gustavo Moura - Especialista em Segurança</figcaption>
                </figure>
            </div>


        </section>


    </main>

    <footer>

        <p>
            &copy; 2026 White Water Rafting | Karina Evelyn Ventura de Oliveira
        </p>

        <nav class="socialmedia">

            <a href="https://facebook.com">
                <img src="imagens/facebook_220200.png" alt="Ícone do Facebook">
            </a>

            <a href="https://linkedin.com">
                <img src="imagens/linkedin_3991775.png" alt="Ícone do Linkedin">
            </a>

            <a href="https://instagram.com">
                <img src="imagens/instagram_174855.png" alt="Ícone do Instagram">
            </a>

        </nav>

    </footer>
</body>

</html>
